<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="wziUL6J8edN4XNvvstP3J1rYadf0uOW-Pi7KXeB3R-o" />
    <title>GenshinZMeows - Genshin Impact Artifact Sorter</title>
    <style>
        body {
            background-color: #09090b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            background-color: #121214;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        a {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }
        .primary-btn {
            background-color: #7c3aed;
            color: white;
        }
        .primary-btn:hover {
            background-color: #8b5cf6;
        }
        .secondary-btn {
            background-color: #27272a;
            color: #e4e4e7;
        }
        .secondary-btn:hover {
            background-color: #3f3f46;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GenshinZMeows</h1>
        <p>
            A fast, offline desktop app for Genshin Impact. 
            Upload your <strong>.GOOD</strong> file to instantly score artifacts, 
            view optimal character builds, check recommended weapons, and plan the perfect team.
        </p>
        <div class="buttons">
            <a href="https://github.com/ShadowGamer/GenshinZMeows/releases/latest" class="primary-btn">
                ⬇️ Download Latest Version
            </a>
            <a href="https://github.com/ShadowGamer/GenshinZMeows" class="secondary-btn">
                💻 View Source Code on GitHub
            </a>
        </div>
    </div>
</body>
</html>
